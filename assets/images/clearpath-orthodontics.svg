<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="ClearPath Orthodontics ERP illustration" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" color="#34D399">
